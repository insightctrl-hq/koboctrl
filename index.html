/* KoboCTRL identity: silver neutrals with money green, bronze for rewards. Variable names: --cream is the main text colour, --blue is the primary green. */
:root{
  --bg:#F3F5F4;--surface:#FFFFFF;--surface2:#E8ECEA;--line:rgba(15,26,21,.08);--line2:rgba(15,26,21,.16);
  --cream:#0F1A15;--stone:#7A847F;--stone2:#5B6660;--blue:#0F7A50;--blue-tint:rgba(15,122,80,.11);--on-primary:#FFFFFF;
  --gold:#A8702A;--gold-tint:rgba(168,112,42,.13);--red:#C4443B;--red-tint:rgba(196,68,59,.11);
  --silver:#C7CFCB;--bar:rgba(243,245,244,.9);--toast-link:#7BE3B4;
  --hero:linear-gradient(140deg,#0C2E21 0%,#0F5A3C 55%,#13744E 100%);
  --sans:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Segoe UI',Roboto,Arial,sans-serif;
  --serif:'Plus Jakarta Sans','Naira Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --r:18px;--tabbar:62px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0A100D;--surface:#121A16;--surface2:#1A241F;--line:rgba(232,238,234,.08);--line2:rgba(232,238,234,.16);
  --cream:#E8EEEA;--stone:#7E8A84;--stone2:#9DA9A3;--blue:#2DB57C;--blue-tint:rgba(45,181,124,.15);--on-primary:#04130C;
  --gold:#C99550;--gold-tint:rgba(201,149,80,.15);--red:#E0705F;--red-tint:rgba(224,112,95,.15);
  --bar:rgba(10,16,13,.9);--toast-link:#0F7A50;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabbar) + 24px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
header.top{padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{display:inline-flex;align-items:baseline;font-weight:800;font-size:18px;letter-spacing:-.02em}
.mark b{font-weight:800;color:var(--blue)}
.powered{font-size:12px;font-weight:600;color:var(--stone2);letter-spacing:.02em}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.icon-btn .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
h1{font-family:var(--sans);font-weight:800;font-size:34px;letter-spacing:-.03em;line-height:1.05;margin:10px 0 18px}
h2{font-size:18px;font-weight:700;margin:0}
.label{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--stone2)}
.muted{color:var(--stone2)}
.small{font-size:14px}
.num{font-family:var(--serif);font-weight:700;letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums}
p{margin:0 0 10px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hero{padding:22px 20px 20px;background:var(--hero);border:0;color:#F4F7F5;box-shadow:0 12px 30px rgba(12,46,33,.22)}
.hero .label{color:var(--silver)}
.hero .big{font-size:50px;line-height:1;margin:10px 0 8px;font-weight:800}
.hero .sub{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--silver)}
.hero .sub span b{color:#FFFFFF;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:12px;border:0;padding:0 18px;font-weight:700;cursor:pointer;background:var(--surface2);color:var(--cream)}
.btn.primary{background:var(--blue);color:var(--on-primary)}
.btn.gold{background:var(--gold);color:#FFFFFF}
.btn.ghost{background:transparent;border:1px solid var(--line2)}
.btn.danger{background:var(--red-tint);color:var(--red)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.icon-btn:focus-visible,.row:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.next{display:flex;gap:14px;align-items:center}
.next .txt{flex:1;min-width:0}
.next .txt b{display:block;font-size:16px}
.next .txt span{font-size:14px;color:var(--stone2)}
.next.alert{border-color:var(--gold);background:linear-gradient(0deg,var(--gold-tint),var(--gold-tint)),var(--surface)}
.group{padding:6px 0}
.group-head{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px 6px}
.row{display:block;width:100%;text-align:left;background:transparent;border:0;padding:12px 16px;cursor:pointer;border-top:1px solid var(--line)}
.group .row:first-of-type{border-top:0}
.row-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row-top .name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-top .amt{font-size:20px;white-space:nowrap}
.row-meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--stone2);margin-top:2px}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--blue)}
.bar.warn i{background:var(--gold)} .bar.over i{background:var(--red)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--surface2);color:var(--stone2)}
.pill.lock{color:var(--gold);background:var(--gold-tint)}
.pill.over{color:var(--red);background:var(--red-tint)}
.pill.ok{color:var(--blue);background:var(--blue-tint)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer}
.chip small{color:var(--stone2);font-weight:500;margin-left:4px}
.list .item{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.list .item:first-child{border-top:0}
.list .item .l{min-width:0}
.list .item .l b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .item .l span{font-size:13px;color:var(--stone2)}
.list .item .r{white-space:nowrap;font-size:19px}
.in{color:var(--blue)}
.day-head{padding:14px 2px 6px}
.score{display:flex;align-items:flex-end;gap:10px}
.score .big{font-size:72px;line-height:.9}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-child{border-top:0}
.kv span:last-child{font-weight:600;white-space:nowrap}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;font-size:13px;color:var(--stone)}
.badge .b{font-family:var(--sans);font-weight:800;font-size:22px;line-height:1;display:block;margin-bottom:4px}
.badge.on{border-color:var(--gold);color:var(--cream);background:var(--gold-tint)}
.badge.on .b{color:var(--gold)}
.weeks{display:flex;align-items:flex-end;gap:8px;height:80px;margin-top:8px}
.weeks div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:11px;color:var(--stone2)}
.weeks i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--blue);min-height:2px}
.weeks div.cur i{background:var(--gold)}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bar);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabbar .in-bar{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabbar)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--stone);cursor:pointer}
.tab[aria-current="page"]{color:var(--cream)}
.tab[aria-current="page"] svg{stroke:var(--blue)}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(var(--tabbar) + 16px + env(safe-area-inset-bottom,0px));z-index:41;width:58px;height:58px;border-radius:50%;border:0;
  background:var(--blue);color:var(--on-primary);box-shadow:0 10px 24px rgba(12,46,33,.30);cursor:pointer;display:flex;align-items:center;justify-content:center}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-head h2{font-family:var(--sans);font-size:24px;font-weight:800;letter-spacing:-.02em}
.link{background:none;border:0;color:var(--blue);font-weight:600;cursor:pointer;padding:6px 0}
label.f{display:block;font-size:13px;font-weight:600;color:var(--stone2);margin:14px 0 6px}
input.t,select.t,textarea.t{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);color:var(--cream);font:inherit;padding:10px 14px}
textarea.t{min-height:120px;font-size:13px}
input.money{font-family:var(--serif);font-size:42px;font-weight:800;letter-spacing:-.02em;text-align:center;border:0;background:transparent;width:100%;color:var(--cream);padding:6px 0}
input.money::placeholder{color:var(--stone)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--bg);border-radius:12px;padding:4px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:9px;min-height:40px;font-weight:600;font-size:14px;color:var(--stone2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--cream)}
.check{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--blue)}
.split .kv span:first-child{color:var(--stone2)}
.note{font-size:14px;color:var(--stone2);background:var(--bg);border-radius:12px;padding:12px 14px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + 90px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--cream);color:var(--bg);
  font-weight:600;font-size:14px;padding:10px 16px;border-radius:999px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:var(--toast-link);font-weight:700;cursor:pointer}
.setup{min-height:100vh;display:flex;flex-direction:column;padding-top:calc(30px + env(safe-area-inset-top,0px))}
.setup .q{font-family:var(--sans);font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.12;margin:24px 0 8px}
.setup .foot{margin-top:auto;padding:20px 0 calc(20px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.progress-dots{display:flex;gap:4px;margin-top:18px}
.progress-dots i{flex:1;height:3px;border-radius:2px;background:var(--surface2)}
.progress-dots i.on{background:var(--blue)}
.empty{text-align:center;padding:26px 10px;color:var(--stone2)}
/* Opening screens */
.brand{position:fixed;inset:0;overflow:hidden;background:var(--hero);color:#F4F7F5;display:flex;flex-direction:column}
.doodles{position:absolute;inset:0;pointer-events:none;color:#C7CFCB;opacity:.30}
.doodles svg{position:absolute;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){.doodles svg{animation:drift 9s ease-in-out infinite alternate}.doodles svg:nth-child(2n){animation-duration:12s}.doodles svg:nth-child(3n){animation-duration:15s;animation-direction:alternate-reverse}
  @keyframes drift{from{translate:0 0}to{translate:6px -10px}}}
.brand .doodles{bottom:40%}
.brand::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(180deg,rgba(12,46,33,0),rgba(12,46,33,.85) 60%);pointer-events:none}
.brand .inner{position:relative;z-index:1;margin-top:auto;padding:0 max(24px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));max-width:560px;width:100%;align-self:center}
.brand .mark{font-size:30px;color:#FFFFFF}.brand .mark b{color:#7BE3B4}

<div id="app"></div>
<script>
"use strict";
var VERSION = "0.2";
var KEY = "koboctrl-v1";

/* ---------- Helpers ---------- */

function daysLeftInMonth(){ var d = new Date(); return daysInMonth(d) - d.getDate() + 1; }

/* ---------- State ---------- */
var S, V = {tab:"plan", sheet:null, toast:null, setup:{step:0, a:{}}};
function freshState(){ return {v:1, setupDone:false, accounts:[], budgets:[], tx:[], flags:{}, unlocks:[], repay:[], monthKey:mk(), close:null,

var GROUP_RENAME = {"Essentials":"Daily needs", "Buffer":"Cushion", "Commitments":"Giving and family"}, NAME_RENAME = {"Emergency floor":"Emergency money", "Runway":"Leftovers", "Buffer":"Cushion"};

function normalise(x){ var f = freshState(); if (!x || typeof x !== "object") return f; for (var k in f) if (x[k] === undefined) x[k] = f[k]; return migrate(x); }
var storageOK = true;
function load(){ try { var raw = localStorage.getItem(KEY); return normalise(raw ? JSON.parse(raw) : null); } catch(e){ storageOK = false; return freshState(); } }

function B(id){ for (var i = 0; i < S.budgets.length; i++) if (S.budgets[i].id === id) return S.budgets[i]; return null; }
function A(id){ for (var i = 0; i < S.accounts.length; i++) if (S.accounts[i].id === id) return S.accounts[i]; return null; }
function acctByRole(r){ for (var i = 0; i < S.accounts.length; i++) if (S.accounts[i].role === r) return S.accounts[i]; return S.accounts[0]; }
function isPot(b){ return b.kind === "pot" || b.kind === "floor"; }
function sumTx(fn){ var t = 0; for (var i = 0; i < S.tx.length; i++) if (fn(S.tx[i])) t += S.tx[i].amount; return t; }

/* ---------- Budget maths ---------- */
function monthlyNeed(b){
  if (b.paused) return 0;
  if (b.kind === "floor") return b.amount || 0;
  if (b.period === "day") return b.amount * daysInMonth();
  if (b.period === "week") return round100(b.amount * daysInMonth() / 7);

}
function funded(b, m){ m = m || mk(); return sumTx(function(t){ return t.type === "alloc" && t.budgetId === b.id && t.month === m; })
  + sumTx(function(t){ return t.type === "cover" && t.to === b.id && t.month === m; }); }

  + sumTx(function(t){ return t.type === "sweep" && t.from === b.id && t.month === m; }); }

  - sumTx(function(t){ return t.type === "withdraw" && t.budgetId === b.id; }); }
function periodKeys(b, k){ if (b.period === "day") return [k, k]; var ws = weekStart(parseDk(k)); return [ws, addDays(ws, 6)]; }
/* Limit for a day or week period: the base amount, minus any overspend carried in from the period before. */

function carried(b){ var r = periodKeys(b, today()); return b.amount - periodLimit(b, r[0]); }
function budgetView(b){
  var m = mk(), fu = funded(b, m), spM = spentMonth(b, m), leftMonth = fu - spM, o = {b:b, funded:fu, need:monthlyNeed(b), leftMonth:leftMonth};

}
function safeToday(){
  var t = 0;
  S.budgets.forEach(function(b){ if (b.kind !== "spend" || b.paused || b.group === "Cushion" || b.group === "Business") return; var v = budgetView(b), left = Math.max(0, v.left);
    if (b.period === "day") t += left; else if (b.period === "week") t += left / daysLeftInWeek(); else t += left / daysLeftInMonth(); });

}
function lastLogDay(){ var f = null; S.tx.forEach(function(t){ if ((t.type === "out" || t.type === "nospend") && (!f || t.date > f)) f = t.date; }); return f; }
/* Honest date: money you can count on, divided by the faster of your plan pace and your real pace over the last 14 days. */

  S.budgets.forEach(function(b){ if (b.paused || isPot(b) || b.group === "Cushion") return; var m = monthlyNeed(b); planDay += m / dim; if (b.kind === "spend") spendPlanDay += m / dim; var v = budgetView(b); have += Math.max(0, v.leftMonth); });

  var span = Math.max(1, Math.round((parseDk(t0) - parseDk(from)) / 864e5) + 1), spent = 0;

function essentialsMonthly(){ var t = 0; S.budgets.forEach(function(b){ if (b.group === "Daily needs") t += monthlyNeed(Object.assign({}, b, {paused:false})); }); return t; }
function floorTarget(){ return round100(essentialsMonthly() * (S.settings.floorMonths || 3)); }
function toAssign(){ return sumTx(function(t){ return t.type === "in" || t.type === "release"; }) - sumTx(function(t){ return t.type === "alloc" && !t.carry; }) - sumTx(function(t){ return t.type === "repayIn"; }); }
function sweepTarget(){ for (var i = 0; i < S.budgets.length; i++) if (S.budgets[i].sweep) return S.budgets[i]; return null; }
function rewardPot(){ for (var i = 0; i < S.budgets.length; i++) if (S.budgets[i].reward) return S.budgets[i]; return null; }

/* Waterfall: fill each budget's unmet need for this month in funding order, the rest goes to the sweep pot. */

/* Accounts: what the app expects each real account to hold. */
function acctBalance(a){
  var bal = a.start || 0;
  S.tx.forEach(function(t){
    if (t.type === "in" && !t.opening && t.account === a.id) bal += t.amount;
    if (t.type === "out"){ var b = B(t.budgetId); if ((t.account || (b && b.account)) === a.id) bal -= t.amount; }
    if (t.type === "move"){ if (t.to === a.id) bal += t.amount; if (t.from === a.id) bal -= t.amount; }

function weeklyAllowance(){
  var spendAcct = acctByRole("spend"), t = 0;
  S.budgets.forEach(function(b){ if (b.kind !== "spend" || b.paused || b.group === "Cushion" || b.account !== spendAcct.id) return; var v = budgetView(b), add;

}

/* ---------- Score, streaks, badges ---------- */
function loggedOn(k){ return S.tx.some(function(t){ return (t.type === "out" || t.type === "nospend") && t.date === k; }); }
function weekScore(ws){
  var now = today(), end = addDays(ws, 6), last = now < end ? now : end, days = 0, logged = 0, overs = 0, unrec = 0, broke = 0, from = S.started && S.started > ws ? S.started : ws;

    if (b.period === "week"){ if (spentIn(b, ws, end) > periodLimit(b, ws)) overs++; }
    else for (var k2 = ws; k2 <= last; k2 = addDays(k2, 1)) if (spentIn(b, k2, k2) > periodLimit(b, k2)) overs++; });

    budgets: Math.max(0, 30 - 10 * overs - 5 * unrec),

    check: f.check ? 15 : 0,
    locks: broke ? 0 : 10 };

  return parts;
}
function checkStreak(){
  var y = addDays(today(), -1), k = addDays(S.streak.checked, 1), changed = false, firstLog = firstLogDay();
  while (k <= y){ if (firstLog && k >= firstLog && !loggedOn(k) && !S.streak.frozen[k] && S.streak.freezes > 0){ S.streak.freezes--; S.streak.frozen[k] = 1; changed = true; } k = addDays(k, 1); }

  var lastWs = addDays(weekStart(), -7);
  if (!S.scoreWeeks[lastWs] && firstLog && lastWs >= weekStart(parseDk(firstLog))){ var sc = weekScore(lastWs).total; S.scoreWeeks[lastWs] = sc; if (sc >= 80) S.streak.freezes = Math.min(2, S.streak.freezes + 1); changed = true; }
  if (S.streak.checked !== y){ S.streak.checked = y; changed = true; }
  return changed;
}
function firstLogDay(){ var f = null; S.tx.forEach(function(t){ if ((t.type === "out" || t.type === "nospend") && (!f || t.date < f)) f = t.date; }); return f; }
function streakLen(){ var k = loggedOn(today()) ? today() : addDays(today(), -1), n = 0;
  while (loggedOn(k) || S.streak.frozen[k]){ n++; k = addDays(k, -1); if (n > 999) break; } return n; }
function bestStreak(){ var f = firstLogDay(); if (!f) return 0; var best = 0, cur = 0; for (var k = f; k <= today(); k = addDays(k, 1)){ if (loggedOn(k) || S.streak.frozen[k]){ cur++; best = Math.max(best, cur); } else if (k !== today()) cur = 0; } return best; }
function badges(){

  var fl = S.budgets.filter(function(b){ return b.kind === "floor"; })[0];

    {n:"1", t:"First entry", on:!!firstLogDay()},
    {n:"7", t:"7-day streak", on:bs >= 7},
    {n:"30", t:"30-day streak", on:bs >= 30},
    {n:"✓", t:"Clean week", on:clean >= 1},
    {n:"4", t:"Four clean weeks", on:clean >= 4},
    {n:"M", t:"First month closed", on:!!S.close},
    {n:"★", t:"Pot complete", on:potDone},

}
function monthNoBreak(){ var m = mk(); if (!firstLogDay() || firstLogDay().slice(0, 7) === m) return false; return !S.tx.some(function(t){ return t.type === "withdraw" && t.lockBreak && t.date.slice(0, 7) === m; }); }

/* ---------- Month close (automatic) ---------- */
function monthClose(){

    case "repay": { var r = S.repay.filter(function(z){ return z.id === id; })[0]; if (!r) break; var pay = Math.min(r.weekly, r.total - r.paid);

      snap(); r.paid += pay; S.tx.push({id:uid(), type:"repayIn", budgetId:r.budgetId, amount:pay, date:today()}); save(); toast(naira(pay) + " repaid.", true); break; }
    case "edit-budget": openSheet("edit-budget", {id:id}); break;
    case "save-budget": {
      var name = val("e-name").trim(); if (!name){ toast("Give it a name."); break; } snap();
      var o = id ? B(id) : {id:uid(), created:today()};
      o.name = name; o.kind = val("e-kind"); o.amount = parseAmt(val("e-amt")); o.period = o.kind === "spend" ? val("e-period") : "month"; o.group = val("e-group").trim() || "Other";
      o.order = parseAmt(val("e-order")) || 5; o.account = val("e-acct"); o.dueDay = parseAmt(val("e-due")) || null; o.target = parseAmt(val("e-target")) || 0; o.targetDate = val("e-tdate");
      o.start = parseAmt(val("e-start")); o.locked = document.getElementById("e-locked").checked; o.paused = document.getElementById("e-paused").checked;
      if (document.getElementById("e-sweep").checked){ S.budgets.forEach(function(b){ b.sweep = false; }); o.sweep = true; } else o.sweep = false;
      if (!id) S.budgets.push(o); closeSheet(); save(); toast("Saved.", true); break; }
    case "del-budget": snap(); S.budgets = S.budgets.filter(function(b){ return b.id !== id; }); S.quick = S.quick.filter(function(q){ return q.budgetId !== id; }); closeSheet(); save(); toast("Budget deleted.", true); break;
    case "edit-account": openSheet("edit-account", {id:id}); break;
    case "save-account": { var an = val("a-name").trim(); if (!an){ toast("Give it a name."); break; } snap(); var ao = id ? A(id) : {id:uid()};
      ao.name = an; ao.role = val("a-role"); ao.start = parseAmt(val("a-start")); if (!id) S.accounts.push(ao); closeSheet(); save(); toast("Saved.", true); break; }
    case "tx": openSheet("tx", {id:id}); break;
    case "del-tx": snap(); S.tx = S.tx.filter(function(t){ return t.id !== id; }); closeSheet(); save(); toast("Entry deleted.", true); break;
    case "close-view": openSheet("close-view"); break;
    case "close-ok": S.close.seen = true; closeSheet(); save(); break;
    case "close-undo": { var keep = S.close.snapshot; S = normalise(JSON.parse(keep)); S.monthKey = mk(); S.close = null; closeSheet(); save(); toast("Month close undone. Leftovers stay where they were."); break; }
    case "backup": openSheet("backup"); break;
    case "copy-backup": { var ta = document.getElementById("bk-text"), txt = ta.value;
      var done = function(){ S.lastBackup = Date.now(); save(); toast("Backup copied. Paste it somewhere safe."); render(); };
      try { navigator.clipboard.writeText(txt).then(done, function(){ ta.select(); toast("Select all and copy it."); render(); }); } catch(e2){ ta.select(); toast("Select all and copy it."); }
      return; }
    case "download-backup": { try { var blob = new Blob([backupText()], {type:"application/json"}), aEl = document.createElement("a"); aEl.href = URL.createObjectURL(blob); aEl.download = "koboctrl-backup-" + today() + ".json"; document.body.appendChild(aEl); aEl.click(); aEl.remove(); S.lastBackup = Date.now(); save(); toast("Backup saved."); } catch(e3){ toast("Saving a file is blocked here. Use Copy."); } break; }
    case "do-restore": { try { var o2 = JSON.parse(val("rs-text")); if (!o2 || !o2.budgets || !o2.tx) throw 0; snap(); S = normalise(o2); S.setupDone = true; if (!S.monthKey) S.monthKey = mk(); if (!S.started) S.started = today(); closeSheet(); V.tab = "plan"; save(); toast("Backup restored.", true); } catch(e4){ toast("That does not look like a KoboCTRL backup."); } break; }
    case "do-clear": snap(); S = freshState(); closeSheet(); save(); V.setup = {step:0, a:{}}; toast("Everything cleared.", true); break;
    case "undo": if (undoState){ S = normalise(JSON.parse(undoState)); undoState = null; save(); V.toast = null; toast("Undone."); } break;
    case "goal-add": readSetupStep(); break;
    case "goal-del": V.setup.a.goals.splice(+v, 1); break;
    case "goal-idea": readSetupStep(); V.setup.a.goalName = v; break;
    case "setup-next": readSetupStep(); if (V.setup.step >= STEPS.length - 1){ buildFromSetup(); V.tab = "plan"; toast("Your plan is ready."); } else V.setup.step = nextStep(V.setup.step); break;
    case "intro-next": if ((V.slide || 0) >= INTRO.length - 1){ V.setup.step = 2; } else { goSlide((V.slide || 0) + 1); return; } break;
    case "intro-skip": V.setup.step = 2; break;
    case "intro-back": if ((V.slide || 0) <= 0){ V.setup.step = 0; } else { goSlide((V.slide || 0) - 1); return; } break;
    case "setup-back": readSetupStep(); V.setup.step = prevStep(V.setup.step); if (V.setup.step === 1) V.slide = INTRO.length - 1; break;
    default: return;
  }
  render();
});
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && V.sheet){ closeSheet(); render(); } });

/* ---------- Start ---------- */
applyTheme();
S = load();
if (S.setupDone){ var ch = monthClose(); if (checkStreak() || ch) save(); }
render();
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible" && S.setupDone){ var c2 = monthClose(); if (checkStreak() || c2) save(); render(); } });
</script>
